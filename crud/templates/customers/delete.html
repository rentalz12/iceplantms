{% extends 'layout/base.html' %}

{% block 'title' %}Delete Customer{% endblock %}

{% block 'content' %}
<div class="max-w-lg mx-auto">
    <h2 class="text-2xl font-semibold text-arctic-800 mb-6">Delete Customer</h2>

    <div class="bg-white rounded-xl border border-frost-200 p-6">
        <p class="text-frost-600 mb-6">Are you sure you want to delete <span class="font-semibold text-arctic-800">{{ customer.name }}</span>?</p>
        <form method="POST" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="bg-crimson-500 hover:bg-crimson-600 focus:ring-2 focus:ring-crimson-300 focus:outline-none text-white text-sm px-5 py-2 rounded-lg transition">
                Delete
            </button>
            <a href="{% url 'customer_list' %}" class="text-sm text-frost-500 hover:text-frost-700 px-5 py-2 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
