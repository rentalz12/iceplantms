<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <title>Login — IcePlant MS</title>
</head>
<body class="min-h-screen bg-arctic-900 pt-20 flex justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-ice-300 tracking-tight">IcePlant MS</h1>
            <p class="text-frost-500 font-medium uppercase tracking-wide">Management System</p>
        </div>

        <div class="bg-white rounded-xl border border-frost-200 p-8">
            <h2 class="text-lg font-semibold text-arctic-800 mb-6">Sign in</h2>

             {% if error %}
             <p class="error-msg text-crimson-500 text-sm mb-4 rounded">{{ error }}</p>
             {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-frost-700 mb-1">Username</label>
                    <input type="text" name="username" required
                        class="w-full text-sm border border-frost-200 rounded-lg px-3 py-2 text-frost-800 focus:outline-none focus:ring-2 focus:ring-ice-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-frost-700 mb-1">Password</label>
                    <input type="password" name="password" required
                        class="w-full text-sm border border-frost-200 rounded-lg px-3 py-2 text-frost-800 focus:outline-none focus:ring-2 focus:ring-ice-400">
                </div>
                <button type="submit"
                    class="w-full bg-ice-500 hover:bg-ice-600 text-white text-sm font-medium py-2 rounded-lg transition">
                    Sign in
                </button>
            </form>
        </div>
    </div>
</body>
</html>
