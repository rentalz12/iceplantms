{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <title>{% block 'title' %}{% endblock 'title' %} — IcePlant MS</title>
</head>
<body class="min-h-screen bg-frost-50 text-frost-900">

  <header class="lg:hidden fixed top-0 left-0 right-0 z-40
                 bg-gradient-to-r from-arctic-800 to-arctic-900
                 flex items-center justify-between px-4 h-13
                 shadow-[0_1px_0_rgba(87,214,255,.15),0_4px_12px_rgba(5,44,41,.4)]
                 ring-1 ring-arctic-700/50">
    <a href="{% url 'dashboard' %}"
       class="flex items-center gap-2.5 group">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-ice-400 to-arctic-400
                  flex items-center justify-center text-xs shadow-md shadow-ice-400/20
                  group-active:scale-95 transition-transform">🥶
      </div>
      <span class="text-xs font-bold text-ice-300 tracking-tight">IcePlant MS</span>
    </a>

    <button id="sidebar-toggle" aria-label="Open menu"
        class="text-frost-300 hover:text-white
               focus:outline-none focus:ring-2 focus:ring-ice-400
               rounded-lg p-1.5 transition-colors active:scale-95">
      <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div id="sidebar-overlay"
      class="fixed inset-0 z-30 bg-black/60
             hidden lg:hidden transition-opacity duration-200"
      aria-hidden="true">
  </div>

  <div class="flex h-screen lg:pt-0 pt-14">
    {% include 'include/sidebar.html' %}
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8">
      {% block 'content' %}{% endblock 'content' %}
    </main>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
